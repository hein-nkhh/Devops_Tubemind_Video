version: '3.8'

services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================
  
  # 1. Database: PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: tubemind-postgres
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: tubemind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tubemind-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d tubemind_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Message Queue: Redis
  redis:
    image: redis:7-alpine
    container_name: tubemind-redis
    ports:
      - "6379:6379"
    networks:
      - tubemind-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO (Giả lập AWS S3)
  minio:
    image: minio/minio
    container_name: tubemind-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000" # API Port (Code gọi vào đây)
      - "9001:9001" # Console Port (Truy cập web UI)
    volumes:
      - minio_data:/data
    networks:
      - tubemind-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Tool tạo Bucket trong MinIO khi khởi động
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minio_admin minio_password;
      /usr/bin/mc mb myminio/tubemind-videos --ignore-existing;
      /usr/bin/mc anonymous set public myminio/tubemind-videos;
      exit 0;
      "
    networks:
      - tubemind-net

  # 4. Mock Email: Mailhog (Thay thế aws sns để thử nghiệm gửi email)
  mailhog:
    image: mailhog/mailhog
    container_name: tubemind-mailhog
    ports:
      - "1025:1025" # SMTP port (Service Notifier gửi mail vào đây)
      - "8025:8025" # Web UI (Vào xem mail đã gửi chưa)
    networks:
      - tubemind-net

  # =============================================================================
  # Application Services
  # =============================================================================

  # 5. API Gateway - Entry point for all requests
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: tubemind-api-gateway
    ports:
      - "8000:8000"
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: tubemind_db
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_BUCKET_NAME: tubemind-videos
      MINIO_SECURE: "false"
      # Email (MailHog)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: noreply@tubemind.local
      # Logging
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tubemind-net
    restart: unless-stopped

  # 6. Transcriber Worker - Whisper-based transcription
  transcriber-worker:
    build:
      context: .
      dockerfile: services/transcriber-worker/Dockerfile
    container_name: tubemind-transcriber
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: tubemind_db
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_BUCKET_NAME: tubemind-videos
      MINIO_SECURE: "false"
      # Email (MailHog)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: noreply@tubemind.local
      # Whisper
      WHISPER_MODEL_SIZE: turbo
      TEMP_DIR: /tmp/tubemind
      # Logging
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tubemind-net
    volumes:
      - transcriber_temp:/tmp/tubemind
    restart: unless-stopped

  # 7. Summarizer Worker - Gemini API summarization
  summarizer-worker:
    build:
      context: .
      dockerfile: services/summarizer-worker/Dockerfile
    container_name: tubemind-summarizer
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: tubemind_db
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_BUCKET_NAME: tubemind-videos
      MINIO_SECURE: "false"
      # Email (MailHog)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: noreply@tubemind.local
      # Gemini API - Set your API key here or via .env file
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key_here}
      # Logging
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tubemind-net
    restart: unless-stopped

  # 8. Notifier Service - Email notifications
  notifier-service:
    build:
      context: .
      dockerfile: services/notifier-service/Dockerfile
    container_name: tubemind-notifier
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: tubemind_db
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Email (MailHog)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: noreply@tubemind.local
      # Logging
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - tubemind-net
    restart: unless-stopped

networks:
  tubemind-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  transcriber_temp: