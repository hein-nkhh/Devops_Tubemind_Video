apiVersion: apps/v1
kind: Deployment
metadata:
  name: tubemind-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tubemind-api
  template:
    metadata:
      labels:
        app: tubemind-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.global.ecrRegistry }}/{{ .Values.api.image.name }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - containerPort: 8000

          # ======================
          # Environment Variables
          # ======================
          env:
            # -------- Database --------
            - name: POSTGRES_HOST
              value: {{ .Values.external.db.host | quote }}

            - name: POSTGRES_PORT
              value: {{ .Values.external.db.port | quote }}

            - name: POSTGRES_DB
              value: {{ .Values.external.db.name | quote }}

            - name: POSTGRES_USER
              value: {{ .Values.external.db.user | quote }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tubemind-secrets
                  key: POSTGRES_PASSWORD

            # -------- Redis --------
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}

            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}

            # -------- S3 --------
            - name: S3_BUCKET_NAME
              value: {{ .Values.external.s3.bucketName | quote }}

            - name: AWS_REGION
              value: {{ .Values.external.s3.region | quote }}

          # ======================
          # Health Checks
          # ======================
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # ======================
          # Resources (Best practice)
          # ======================
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tubemind-api
spec:
  type: NodePort
  selector:
    app: tubemind-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30000
