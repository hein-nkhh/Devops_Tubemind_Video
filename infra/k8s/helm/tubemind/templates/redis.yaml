# 1. PHẦN SERVICE (Cái này đang thiếu dẫn đến lỗi API không tìm thấy Redis)
apiVersion: v1
kind: Service
metadata:
  name: tubemind-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: tubemind-redis

---

# 2. PHẦN DEPLOYMENT (Giữ nguyên logic của bạn nhưng sửa Label cho chuẩn)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tubemind-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tubemind-redis
  template:
    metadata:
      labels:
        app: tubemind-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
