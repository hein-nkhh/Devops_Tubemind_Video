---
- name: Setup CI Server
  hosts: ci_servers
  become: true
  vars:
    workdir: /home/ec2-user/ci
    swapfile: /swapfile

  tasks:
    # -----------------------------
    # CREATE SWAP (2GB)
    # -----------------------------
    - name: Create 2GB swapfile
      shell: |
        fallocate -l 2G {{ swapfile }}
        chmod 600 {{ swapfile }}
        mkswap {{ swapfile }}
        swapon {{ swapfile }}
      args:
        creates: "{{ swapfile }}"

    # -----------------------------
    # INSTALL DOCKER
    # -----------------------------
    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    # -----------------------------
    # DOCKER COMPOSE PLUGIN
    # -----------------------------
    - name: Install Docker Compose plugin v2
      shell: |
        mkdir -p /usr/local/lib/docker/cli-plugins
        curl -SL https://github.com/docker/compose/releases/download/v2.25.0/docker-compose-linux-x86_64 \
          -o /usr/local/lib/docker/cli-plugins/docker-compose
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
      args:
        creates: /usr/local/lib/docker/cli-plugins/docker-compose

    # -----------------------------
    # SONAR REQUIREMENT
    # -----------------------------
    - name: Set vm.max_map_count for SonarQube
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        reload: yes

    # -----------------------------
    # WORKDIR
    # -----------------------------
    - name: Create CI working directory
      file:
        path: "{{ workdir }}"
        state: directory
        owner: ec2-user
        mode: '0755'

    - name: Copy Docker Compose file
      copy:
        src: ./files/docker-compose.yml
        dest: "{{ workdir }}/docker-compose.yml"
        owner: ec2-user

    # -----------------------------
    # START JENKINS & SONAR
    # -----------------------------
    - name: Start Jenkins first
      shell: docker compose up -d jenkins
      args:
        chdir: "{{ workdir }}"

    - name: Start SonarQube after Jenkins
      shell: docker compose up -d sonarqube
      args:
        chdir: "{{ workdir }}"

    # -----------------------------
    # HELM INSTALL
    # -----------------------------
    - name: Install Helm CLI
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    # -----------------------------
    # TRIVY INSTALL
    # -----------------------------
    - name: Install Trivy
      shell: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      args:
        creates: /usr/local/bin/trivy
